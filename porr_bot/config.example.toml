# Copy to config.toml and edit.  API keys are NOT stored here:
# set the environment variables WEBULL_APP_KEY and WEBULL_APP_SECRET instead.

[strategy]                 # same settings as the TradingView v2.0 inputs
symbol          = "MNQZ6"  # Webull contract code: product + month letter + 1-digit year (Z6 = Dec 2026). Roll each quarter!
tick            = 0.25
range_start     = "07:00"  # America/Chicago
range_end       = "08:30"
trade_start     = "08:30"
trade_end       = "11:00"
flat_at_end     = true
tp_ticks        = 500
sl_ticks        = 100
use_be          = true
use_line_tp     = false    # true = TP at the opposite range line
be_trigger      = 100
be_offset       = 50
use_trend_tp    = true
tp_trend_ticks  = 750
trend_minutes   = 1440     # live mode uses Webull daily bars for the trend
trend_len       = 50
use_flip        = false
flip_tp         = 100
flip_sl         = 100
contracts       = 1
max_contracts_cap = 1      # hard safety cap per order - raise deliberately
max_trades      = 4
one_per_level   = true
skip_broken     = false    # skip a line once price breaks through it without our fill
allow_long      = true
allow_short     = true
entry_delay     = 10
# VIX regime: after VIX closes > vix_drop points lower, trade range BREAKOUTS instead of fades
use_vix_switch  = true
vix_drop        = 0.9
bo_tp           = 800
bo_sl           = 300
bo_use_be       = true
bo_be_trigger   = 200
bo_be_offset    = 100
bo_max_trades   = 2
trade_log       = "trades.csv"

[webull]
# Market data always uses the LIVE key (env WEBULL_APP_KEY / WEBULL_APP_SECRET) on Webull production and
# needs the OpenAPI futures data subscription (OpenAPI Advanced Quotes -> CME).
# Order modes:
#   paper = true                   -> fills simulated inside the bot, no orders sent anywhere
#   paper = false, sandbox = true  -> orders go to the Webull PAPER account
#                                     (env WEBULL_PAPER_APP_KEY / WEBULL_PAPER_APP_SECRET)
#   paper = false, sandbox = false -> REAL orders on the live account. Only after paper testing!
paper        = false
sandbox      = true
paper_account_id = "YOUR_PAPER_FUTURES_ACCOUNT_ID"   # from wb_check.py, test server, "Futures"
account_id   = "YOUR_LIVE_FUTURES_ACCOUNT_ID"        # live account labelled "Futures" (real orders only)
exit_after_session = true  # stop after the trade window; schedule the bot to start again each morning
poll_seconds = 2.0         # price poll interval
order_events = false       # live mode only: true = use Webull's order-status push stream (a persistent
                           # connection). false = poll order status instead, which needs no streaming slot.

[email]                    # daily P&L email after the session (today / week-to-date / month-to-date)
enabled   = false
to        = "you@example.com"
from      = "you@gmail.com"
smtp_host = "smtp.gmail.com"
smtp_port = 587
# The password is NOT stored here: set the SMTP_PASSWORD environment variable.
# For Gmail use an App Password (Google Account > Security > 2-Step Verification > App passwords).

[bridge]                   # TradingView -> Webull bridge (python bridge.py --config config.toml)
host = "0.0.0.0"
port = 80                  # TradingView webhooks only call ports 80 (http) or 443 (https)
poll_seconds = 1.0         # how often fills are checked on Webull
# The passphrase is NOT stored here: set BRIDGE_PASSPHRASE (same text as in the TradingView script).
# Orders go to the Webull PAPER account while [webull] sandbox = true.
